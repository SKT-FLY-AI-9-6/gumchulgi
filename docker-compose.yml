services:
  api:
    build: { context: ., dockerfile: server/Dockerfile }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: server/.env
    environment: { DATA_DIR: /data, TZ: Asia/Seoul, APP_ENV: production }
    volumes: [ "./data:/data" ]
    restart: unless-stopped
  worker:
    build: { context: ., dockerfile: server/Dockerfile }
    command: python -m worker.main
    env_file: server/.env
    environment: { DATA_DIR: /data, TZ: Asia/Seoul, APP_ENV: production }
    volumes: [ "./data:/data" ]
    restart: unless-stopped
