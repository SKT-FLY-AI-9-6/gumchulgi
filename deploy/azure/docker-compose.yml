name: softreel-azure

x-app: &app
  build:
    context: ../..
    dockerfile: server/Dockerfile.web
    args:
      API_BASE: ""
  image: softreel-web:platform-mvp
  env_file: .env
  environment:
    APP_ENV: production
    DATA_DIR: /data
    TZ: Asia/Seoul
  volumes:
    - softreel-data:/data
  restart: unless-stopped

services:
  api:
    <<: *app
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    command: python -m worker.main
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  softreel-data:
  caddy-data:
  caddy-config:
